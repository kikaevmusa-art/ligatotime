<body>
  <div id="root">
    <div class="loading">
      <div class="spinner"></div>
      <div style="color: #8a8279;">Загрузка...</div>
    </div>
  </div>
  
  <script type="text/babel">
    const { useState, useMemo, useEffect, useCallback } = React;

    // ====== НАСТРОЙКИ GOOGLE SHEETS ======
    // Инструкция по настройке в README.md
    const CONFIG = {
      // Вставьте сюда ID вашего Google Apps Script (Web App URL)
      SCRIPT_URL: '', // Например: 'https://script.google.com/macros/s/AKfycbw_rv1O4drNYxF38V9UhXNASU5a396_qIYGoo1KALwHTZaoE58JmKErMzWGk6-h9RxZtw/exec'
    };

    // ====== РАБОТА С GOOGLE SHEETS ======
    const api = {
      async load() {
        if (!CONFIG.SCRIPT_URL) return null;
        try {
          const res = await fetch(`${CONFIG.SCRIPT_URL}?action=load`);
          return await res.json();
        } catch (e) {
          console.error('Ошибка загрузки:', e);
          return null;
        }
      },
      
      async save(data) {
        if (!CONFIG.SCRIPT_URL) return false;
        try {
          await fetch(CONFIG.SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'save', data })
          });
          return true;
        } catch (e) {
          console.error('Ошибка сохранения:', e);
          return false;
        }
      }
    };

    // ====== НАЧАЛЬНЫЕ ДАННЫЕ ======
    const initialData = {
      employees: [
        { id: 1, name: 'Иванов А.С.', position: 'Ведущий инженер', isMod: false },
        { id: 2, name: 'Петрова М.В.', position: 'Инженер', isMod: false },
        { id: 3, name: 'Сидоров К.Н.', position: 'Ведущий инженер', isMod: false },
        { id: 4, name: 'Козлова Е.А.', position: 'Инженер', isMod: false },
        { id: 100, name: 'Смирнов Д.В.', position: 'Руководитель группы', isMod: true },
      ],
      projects: [
        { id: 1, code: '2024-15', name: 'ЖК Речной' },
        { id: 2, code: '2024-08', name: 'ТЦ Галерея' },
      ],
      sections: [
        { id: 1, projectId: 1, name: 'Фундаменты', employeeId: 1, deadline: '2026-02-13', plannedHours: 32 },
        { id: 2, projectId: 1, name: 'Перекрытия корп.1', employeeId: 2, deadline: '2026-02-18', plannedHours: 48 },
        { id: 3, projectId: 1, name: 'Стены подвала', employeeId: 1, deadline: '2026-02-20', plannedHours: 24 },
        { id: 4, projectId: 2, name: 'Каркас атриума', employeeId: 3, deadline: '2026-02-16', plannedHours: 40 },
        { id: 5, projectId: 2, name: 'Фасадные конструкции', employeeId: 4, deadline: '2026-02-17', plannedHours: 32 },
        { id: 6, projectId: 2, name: 'Кровля', employeeId: 3, deadline: '2026-02-14', plannedHours: 24 },
      ],
      tasks: [
        { id: 1, sectionId: 1, date: '2026-02-02', hours: 8, percent: 15, desc: 'Схема фундаментов секции А' },
        { id: 2, sectionId: 1, date: '2026-02-03', hours: 8, percent: 15, desc: 'Схема фундаментов секции Б' },
        { id: 3, sectionId: 1, date: '2026-02-04', hours: 6, percent: 10, desc: 'Увязка с АР, замечания ГИП' },
        { id: 4, sectionId: 4, date: '2026-02-02', hours: 8, percent: 10, desc: 'Схема колонн атриума' },
        { id: 5, sectionId: 4, date: '2026-02-03', hours: 8, percent: 15, desc: 'Связи, прогоны' },
        { id: 6, sectionId: 4, date: '2026-02-04', hours: 7, percent: 10, desc: 'Балки покрытия' },
        { id: 7, sectionId: 2, date: '2026-02-04', hours: 8, percent: 20, desc: 'Армирование Пм1' },
        { id: 8, sectionId: 2, date: '2026-02-05', hours: 8, percent: 15, desc: 'Армирование Пм2, Пм3' },
        { id: 9, sectionId: 6, date: '2026-02-03', hours: 4, percent: 10, desc: 'Сбор нагрузок' },
        { id: 10, sectionId: 5, date: '2026-02-05', hours: 8, percent: 20, desc: 'Узлы У1-У5' },
        { id: 11, sectionId: 6, date: '2026-02-04', hours: 8, percent: 25, desc: 'Расчёт SCAD' },
        { id: 12, sectionId: 6, date: '2026-02-05', hours: 6, percent: 15, desc: 'Проверка прогибов' },
      ]
    };

    // ====== ГЛАВНЫЙ КОМПОНЕНТ ======
    const TimeTracker = () => {
      const [data, setData] = useState(initialData);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [lastSync, setLastSync] = useState(null);
      const [isOnline, setIsOnline] = useState(!!CONFIG.SCRIPT_URL);
      
      const { employees, projects, sections, tasks } = data;

      // Загрузка данных при старте
      useEffect(() => {
        const loadData = async () => {
          if (CONFIG.SCRIPT_URL) {
            const loaded = await api.load();
            if (loaded && loaded.employees) {
              setData(loaded);
              setLastSync(new Date());
              setIsOnline(true);
            } else {
              // Если не удалось загрузить — используем localStorage как fallback
              const local = localStorage.getItem('ligato_data');
              if (local) setData(JSON.parse(local));
              setIsOnline(false);
            }
          } else {
            // Нет настроенного API — работаем локально
            const local = localStorage.getItem('ligato_data');
            if (local) setData(JSON.parse(local));
            setIsOnline(false);
          }
          setLoading(false);
        };
        loadData();
      }, []);

      // Сохранение данных
      const saveData = useCallback(async (newData) => {
        setData(newData);
        localStorage.setItem('ligato_data', JSON.stringify(newData));
        
        if (CONFIG.SCRIPT_URL) {
          setSaving(true);
          const success = await api.save(newData);
          setSaving(false);
          if (success) {
            setLastSync(new Date());
            setIsOnline(true);
          } else {
            setIsOnline(false);
          }
        }
      }, []);

      // Обновление отдельных частей данных
      const updateData = (key, value) => {
        const newData = { ...data, [key]: typeof value === 'function' ? value(data[key]) : value };
        saveData(newData);
      };

      const setEmployees = (val) => updateData('employees', val);
      const setProjects = (val) => updateData('projects', val);
      const setSections = (val) => updateData('sections', val);
      const setTasks = (val) => updateData('tasks', val);

      // Периодическая синхронизация (каждые 30 сек)
      useEffect(() => {
        if (!CONFIG.SCRIPT_URL) return;
        const interval = setInterval(async () => {
          const loaded = await api.load();
          if (loaded && loaded.employees) {
            setData(loaded);
            setLastSync(new Date());
            setIsOnline(true);
          }
        }, 30000);
        return () => clearInterval(interval);
      }, []);

      const [currentUserId, setCurrentUserId] = useState(100);
      const [view, setView] = useState('gantt');
      const [selectedProject, setSelectedProject] = useState(null);
      const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
      const [expanded, setExpanded] = useState(new Set([1, 4, 6]));
      const [modal, setModal] = useState(null);
      const [form, setForm] = useState({});

      const today = new Date().toISOString().split('T')[0];
      const user = employees.find(e => e.id === currentUserId);
      const isMod = user?.isMod;

      const getSectionHours = (id) => tasks.filter(t => t.sectionId === id).reduce((s, t) => s + t.hours, 0);
      const getSectionProgress = (sec) => sec.plannedHours > 0 ? Math.min(Math.round((getSectionHours(sec.id) / sec.plannedHours) * 100), 100) : 0;
      const getSectionWorkPercent = (id) => Math.min(tasks.filter(t => t.sectionId === id).reduce((s, t) => s + (t.percent || 0), 0), 100);

      const mySections = useMemo(() => sections.filter(s => s.employeeId === currentUserId), [sections, currentUserId]);
      const myTodayTasks = useMemo(() => {
        const ids = mySections.map(s => s.id);
        return tasks.filter(t => ids.includes(t.sectionId) && t.date === today);
      }, [tasks, mySections, today]);
      const myTodayHours = myTodayTasks.reduce((s, t) => s + t.hours, 0);

      const filteredSections = useMemo(() => {
        return selectedProject ? sections.filter(s => s.projectId === selectedProject) : sections;
      }, [sections, selectedProject]);

      const dateRange = useMemo(() => {
        const allDates = [
          ...filteredSections.map(s => new Date(s.deadline)),
          ...tasks.filter(t => filteredSections.some(s => s.id === t.sectionId)).map(t => new Date(t.date)),
          new Date(today)
        ];
        if (allDates.length === 0) {
          const days = [];
          for (let i = 0; i < 14; i++) days.push(new Date(Date.now() + i * 86400000));
          return days;
        }
        const min = new Date(Math.min(...allDates)); min.setDate(min.getDate() - 2);
        const max = new Date(Math.max(...allDates)); max.setDate(max.getDate() + 2);
        const days = [];
        for (let d = new Date(min); d <= max; d.setDate(d.getDate() + 1)) days.push(new Date(d));
        return days;
      }, [filteredSections, tasks, today]);

      const fmt = (d) => new Date(d).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
      const fmtFull = (d) => new Date(d).toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
      const fmtTime = (d) => d ? d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
      const isWknd = (d) => [0, 6].includes(new Date(d).getDay());
      const isToday = (d) => new Date(d).toISOString().split('T')[0] === today;

      const grouped = useMemo(() => {
        const projIds = [...new Set(filteredSections.map(s => s.projectId))];
        return projIds.map(pid => ({
          project: projects.find(p => p.id === pid),
          sections: filteredSections.filter(s => s.projectId === pid)
        }));
      }, [filteredSections, projects]);

      const stats = useMemo(() => ({
        sections: filteredSections.length,
        planned: filteredSections.reduce((s, sec) => s + sec.plannedHours, 0),
        actual: filteredSections.reduce((s, sec) => s + getSectionHours(sec.id), 0),
        progress: filteredSections.length ? Math.round(filteredSections.reduce((s, sec) => s + getSectionProgress(sec), 0) / filteredSections.length) : 0,
        workProgress: filteredSections.length ? Math.round(filteredSections.reduce((s, sec) => s + getSectionWorkPercent(sec.id), 0) / filteredSections.length) : 0
      }), [filteredSections, tasks]);

      // CRUD операции
      const saveSection = () => {
        const { projectId, name, employeeId, deadline, plannedHours } = form;
        if (!projectId || !name || !employeeId || !deadline) return;
        if (modal === 'editSection') {
          setSections(sections.map(s => s.id === form.id ? { ...s, projectId: +projectId, name, employeeId: +employeeId, deadline, plannedHours: +plannedHours || 0 } : s));
        } else {
          setSections([...sections, { id: Date.now(), projectId: +projectId, name, employeeId: +employeeId, deadline, plannedHours: +plannedHours || 0 }]);
        }
        closeModal();
      };

      const deleteSection = (id) => {
        if (!confirm('Удалить раздел?')) return;
        setSections(sections.filter(s => s.id !== id));
        setTasks(tasks.filter(t => t.sectionId !== id));
      };

      const saveTask = () => {
        const { sectionId, date, hours, desc, percent } = form;
        if (!hours || !desc) return;
        if (modal === 'editTask') {
          setTasks(tasks.map(t => t.id === form.id ? { ...t, date: date || today, hours: +hours, desc, percent: +percent || 0 } : t));
        } else {
          setTasks([...tasks, { id: Date.now(), sectionId, date: date || today, hours: +hours, desc, percent: +percent || 0 }]);
        }
        closeModal();
      };

      const deleteTask = (id) => {
        if (!confirm('Удалить?')) return;
        setTasks(tasks.filter(t => t.id !== id));
      };

      const saveProject = () => {
        if (!form.code || !form.name) return;
        if (modal === 'editProject') {
          setProjects(projects.map(p => p.id === form.id ? { ...p, code: form.code, name: form.name } : p));
        } else {
          setProjects([...projects, { id: Date.now(), code: form.code, name: form.name }]);
        }
        closeModal();
      };

      const saveEmployee = () => {
        if (!form.name || !form.position) return;
        if (modal === 'editEmployee') {
          setEmployees(employees.map(e => e.id === form.id ? { ...e, name: form.name, position: form.position, isMod: form.isMod || false } : e));
        } else {
          setEmployees([...employees, { id: Date.now(), name: form.name, position: form.position, isMod: form.isMod || false }]);
        }
        closeModal();
      };

      const deleteEmployee = (id) => {
        const emp = employees.find(e => e.id === id);
        const empSections = sections.filter(s => s.employeeId === id);
        if (empSections.length > 0) {
          if (!confirm(`У ${emp?.name} есть ${empSections.length} разделов. Удалить сотрудника и все его разделы?`)) return;
          const sectionIds = empSections.map(s => s.id);
          const newData = { ...data, employees: employees.filter(e => e.id !== id), sections: sections.filter(s => s.employeeId !== id), tasks: tasks.filter(t => !sectionIds.includes(t.sectionId)) };
          saveData(newData);
        } else {
          if (!confirm(`Удалить ${emp?.name}?`)) return;
          setEmployees(employees.filter(e => e.id !== id));
        }
        if (currentUserId === id) setCurrentUserId(employees.find(e => e.id !== id)?.id || 100);
      };

      const deleteProject = (id) => {
        const proj = projects.find(p => p.id === id);
        const projSections = sections.filter(s => s.projectId === id);
        if (projSections.length > 0) {
          if (!confirm(`В проекте "${proj?.name}" есть ${projSections.length} разделов. Удалить проект со всеми разделами?`)) return;
          const sectionIds = projSections.map(s => s.id);
          const newData = { ...data, projects: projects.filter(p => p.id !== id), sections: sections.filter(s => s.projectId !== id), tasks: tasks.filter(t => !sectionIds.includes(t.sectionId)) };
          saveData(newData);
        } else {
          if (!confirm(`Удалить проект "${proj?.name}"?`)) return;
          setProjects(projects.filter(p => p.id !== id));
        }
      };

      const closeModal = () => { setModal(null); setForm({}); };

      const tasksByDate = useMemo(() => tasks.filter(t => t.date === selectedDate), [tasks, selectedDate]);

      const resetData = () => {
        if (confirm('Сбросить все данные к начальным значениям?')) {
          saveData(initialData);

      };

                        <div>
                          <label className="block text-sm font-medium text-sand-600 mb-1.5">Срок</label>
                          <input type="date" value={form.deadline || ''} onChange={e => setForm({ ...form, deadline: e.target.value })} className="w-full h-10 px-3 border border-sand-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sage-200" />
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-sand-600 mb-1.5">План, часов</label>
                          <input type="number" value={form.plannedHours || ''} onChange={e => setForm({ ...form, plannedHours: e.target.value })} placeholder="40" className="w-full h-10 px-3 border border-sand-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sage-200" />
                        </div>
                      </div>
                    </div>
                    <div className="px-5 sm:px-6 py-4 border-t border-sand-200 flex justify-end gap-3">
                      <button onClick={closeModal} className="h-10 px-4 text-sm font-medium text-sand-500 hover:bg-sand-200 rounded-lg">Отмена</button>
                      <button onClick={saveSection} className="h-10 px-5 text-sm font-medium text-white bg-sage-400 hover:bg-sage-500 rounded-lg">{modal === 'editSection' ? 'Сохранить' : 'Назначить'}</button>
                    </div>
                  </>
                )}

                {(modal === 'addTask' || modal === 'editTask') && (
                  <>
                    <div className="px-5 sm:px-6 py-5 border-b border-sand-200">
                      <h2 className="text-lg font-semibold text-sand-700">{modal === 'editTask' ? 'Редактировать запись' : 'Записать работу'}</h2>
                      {modal === 'addTask' && form.sectionId && (
                        <p className="text-sm text-sand-400 mt-1">{sections.find(s => s.id === form.sectionId)?.name}</p>
                      )}
                    </div>
                    <div className="px-5 sm:px-6 py-5 space-y-4">
                      <div>
                        <label className="block text-sm font-medium text-sand-600 mb-1.5">Дата</label>
                        <input type="date" value={form.date || today} onChange={e => setForm({ ...form, date: e.target.value })} className="w-full h-10 px-3 border border-sand-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sage-200" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-sand-600 mb-1.5">Часы</label>
                        <div className="flex gap-2 mb-2">
                          {[1, 2, 4, 6, 8].map(h => (
                            <button key={h} onClick={() => setForm({ ...form, hours: h.toString() })} className={`flex-1 h-10 rounded-lg text-sm font-medium transition-colors ${form.hours === h.toString() ? 'bg-sage-400 text-white' : 'bg-sand-200 text-sand-600 hover:bg-sand-300'}`}>{h}</button>
                          ))}
                        </div>
                        <input type="number" step="0.5" value={form.hours || ''} onChange={e => setForm({ ...form, hours: e.target.value })} placeholder="Или введите вручную" className="w-full h-10 px-3 border border-sand-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sage-200" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-sand-600 mb-1.5">Что сделано</label>
                        <textarea value={form.desc || ''} onChange={e => setForm({ ...form, desc: e.target.value })} placeholder="Опишите выполненную работу..." rows={3} className="w-full px-3 py-2 border border-sand-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sage-200 resize-none" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-sand-600 mb-1.5">% выполнения за этот период</label>
                        <div className="flex gap-2 mb-2">
                          {[5, 10, 15, 20, 25].map(p => (
                            <button key={p} onClick={() => setForm({ ...form, percent: p.toString() })} className={`flex-1 h-10 rounded-lg text-sm font-medium transition-colors ${form.percent === p.toString() ? 'bg-emerald-600 text-white' : 'bg-sand-200 text-sand-600 hover:bg-sand-300'}`}>{p}%</button>
                          ))}
                        </div>
                        <input type="number" min="0" max="100" step="1" value={form.percent || ''} onChange={e => setForm({ ...form, percent: e.target.value })} placeholder="Или введите вручную (0-100)" className="w-full h-10 px-3 border border-sand-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sage-200" />
                      </div>
                    </div>
                    <div className="px-5 sm:px-6 py-4 border-t border-sand-200 flex justify-end gap-3">
                      <button onClick={closeModal} className="h-10 px-4 text-sm font-medium text-sand-500 hover:bg-sand-200 rounded-lg">Отмена</button>
                      <button onClick={saveTask} disabled={!form.desc} className="h-10 px-5 text-sm font-medium text-white bg-sage-400 hover:bg-sage-500 disabled:bg-sand-300 rounded-lg">Записать</button>
                    </div>
                  </>
                )}

                {(modal === 'addProject' || modal === 'editProject') && (
                  <>
                    <div className="px-5 sm:px-6 py-5 border-b border-sand-200">
                      <h2 className="text-lg font-semibold text-sand-700">{modal === 'editProject' ? 'Редактировать проект' : 'Добавить проект'}</h2>
                    </div>
                    <div className="px-5 sm:px-6 py-5 space-y-4">
                      <div>
                        <label className="block text-sm font-medium text-sand-600 mb-1.5">Шифр</label>
                        <input type="text" value={form.code || ''} onChange={e => setForm({ ...form, code: e.target.value })} placeholder="2025-01" className="w-full h-10 px-3 border border-sand-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sage-200" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-sand-600 mb-1.5">Название</label>
                        <input type="text" value={form.name || ''} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="ЖК Название" className="w-full h-10 px-3 border border-sand-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sage-200" />
                      </div>
                    </div>
                    <div className="px-5 sm:px-6 py-4 border-t border-sand-200 flex justify-end gap-3">
                      <button onClick={closeModal} className="h-10 px-4 text-sm font-medium text-sand-500 hover:bg-sand-200 rounded-lg">Отмена</button>
                      <button onClick={saveProject} className="h-10 px-5 text-sm font-medium text-white bg-sage-400 hover:bg-sage-500 rounded-lg">{modal === 'editProject' ? 'Сохранить' : 'Добавить'}</button>
                    </div>
                  </>
                )}

                {(modal === 'addEmployee' || modal === 'editEmployee') && (
                  <>
                    <div className="px-5 sm:px-6 py-5 border-b border-sand-200">
                      <h2 className="text-lg font-semibold text-sand-700">{modal === 'editEmployee' ? 'Редактировать сотрудника' : 'Добавить сотрудника'}</h2>
                    </div>
                    <div className="px-5 sm:px-6 py-5 space-y-4">
                      <div>
                        <label className="block text-sm font-medium text-sand-600 mb-1.5">ФИО</label>
                        <input type="text" value={form.name || ''} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="Иванов И.И." className="w-full h-10 px-3 border border-sand-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sage-200" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-sand-600 mb-1.5">Должность</label>
                        <input type="text" value={form.position || ''} onChange={e => setForm({ ...form, position: e.target.value })} placeholder="Инженер" className="w-full h-10 px-3 border border-sand-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sage-200" />
                      </div>
                      <label className="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" checked={form.isMod || false} onChange={e => setForm({ ...form, isMod: e.target.checked })} className="w-4 h-4 rounded border-sand-300" />
                        <span className="text-sm text-sand-600">Руководитель</span>
                      </label>
                    </div>
                    <div className="px-5 sm:px-6 py-4 border-t border-sand-200 flex justify-end gap-3">
                      <button onClick={closeModal} className="h-10 px-4 text-sm font-medium text-sand-500 hover:bg-sand-200 rounded-lg">Отмена</button>
                      <button onClick={saveEmployee} className="h-10 px-5 text-sm font-medium text-white bg-sage-400 hover:bg-sage-500 rounded-lg">{modal === 'editEmployee' ? 'Сохранить' : 'Добавить'}</button>
                    </div>
                  </>
                )}
              </div>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<TimeTracker />);
  </script>
</body>
</html>
