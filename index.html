<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЛИГАТО — Учёт рабочего времени</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%232563eb' rx='20' width='100' height='100'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='50' font-weight='bold'>Л</text></svg>">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 1rem; }
    .spinner { width: 40px; height: 40px; border: 3px solid #e5e5e5; border-top-color: #2563eb; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading">
      <div class="spinner"></div>
      <div style="color: #737373;">Загрузка...</div>
    </div>
  </div>
  
  <script type="text/babel">
    const { useState, useMemo, useEffect, useCallback } = React;

    // ====== НАСТРОЙКИ GOOGLE SHEETS ======
    // Инструкция по настройке в README.md
    const CONFIG = {
      // Вставьте сюда ID вашего Google Apps Script (Web App URL)
      SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbyWF0kEKdsPzh8qncxOefRr1eleWwJ-uEzShyWC0y2ies4_1sMtly3PkXdrUnWrMPba/exec', // Например: 'https://script.google.com/macros/s/AKfycbw_rv1O4drNYxF38V9UhXNASU5a396_qIYGoo1KALwHTZaoE58JmKErMzWGk6-h9RxZtw/exec'
    };

    // ====== РАБОТА С GOOGLE SHEETS ======
    const api = {
      async load() {
        if (!CONFIG.SCRIPT_URL) return null;
        try {
          const res = await fetch(`${CONFIG.SCRIPT_URL}?action=load`);
          return await res.json();
        } catch (e) {
          console.error('Ошибка загрузки:', e);
          return null;
        }
      },
      
      async save(data) {
        if (!CONFIG.SCRIPT_URL) return false;
        try {
          await fetch(CONFIG.SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'save', data })
          });
          return true;
        } catch (e) {
          console.error('Ошибка сохранения:', e);
          return false;
        }
      }
    };

    // ====== НАЧАЛЬНЫЕ ДАННЫЕ ======
    const initialData = {
      employees: [
        { id: 1, name: 'Иванов А.С.', position: 'Ведущий инженер', isMod: false },
        { id: 2, name: 'Петрова М.В.', position: 'Инженер', isMod: false },
        { id: 3, name: 'Сидоров К.Н.', position: 'Ведущий инженер', isMod: false },
        { id: 4, name: 'Козлова Е.А.', position: 'Инженер', isMod: false },
        { id: 100, name: 'Смирнов Д.В.', position: 'Руководитель группы', isMod: true },
      ],
      projects: [
        { id: 1, code: '2024-15', name: 'ЖК Речной' },
        { id: 2, code: '2024-08', name: 'ТЦ Галерея' },
      ],
      sections: [
        { id: 1, projectId: 1, name: 'Фундаменты', employeeId: 1, deadline: '2025-02-07', plannedHours: 32 },
        { id: 2, projectId: 1, name: 'Перекрытия корп.1', employeeId: 2, deadline: '2025-02-12', plannedHours: 48 },
        { id: 3, projectId: 1, name: 'Стены подвала', employeeId: 1, deadline: '2025-02-14', plannedHours: 24 },
        { id: 4, projectId: 2, name: 'Каркас атриума', employeeId: 3, deadline: '2025-02-10', plannedHours: 40 },
        { id: 5, projectId: 2, name: 'Фасадные конструкции', employeeId: 4, deadline: '2025-02-11', plannedHours: 32 },
        { id: 6, projectId: 2, name: 'Кровля', employeeId: 3, deadline: '2025-02-08', plannedHours: 24 },
      ],
      tasks: [
        { id: 1, sectionId: 1, date: '2025-02-03', hours: 8, desc: 'Схема фундаментов секции А' },
        { id: 2, sectionId: 1, date: '2025-02-04', hours: 8, desc: 'Схема фундаментов секции Б' },
        { id: 3, sectionId: 1, date: '2025-02-05', hours: 6, desc: 'Увязка с АР, замечания ГИП' },
        { id: 4, sectionId: 4, date: '2025-02-03', hours: 8, desc: 'Схема колонн атриума' },
        { id: 5, sectionId: 4, date: '2025-02-04', hours: 8, desc: 'Связи, прогоны' },
        { id: 6, sectionId: 4, date: '2025-02-05', hours: 7, desc: 'Балки покрытия' },
        { id: 7, sectionId: 2, date: '2025-02-05', hours: 8, desc: 'Армирование Пм1' },
        { id: 8, sectionId: 2, date: '2025-02-06', hours: 8, desc: 'Армирование Пм2, Пм3' },
        { id: 9, sectionId: 6, date: '2025-02-04', hours: 4, desc: 'Сбор нагрузок' },
        { id: 10, sectionId: 5, date: '2025-02-06', hours: 8, desc: 'Узлы У1-У5' },
        { id: 11, sectionId: 6, date: '2025-02-05', hours: 8, desc: 'Расчёт SCAD' },
        { id: 12, sectionId: 6, date: '2025-02-06', hours: 6, desc: 'Проверка прогибов' },
      ]
    };

    // ====== ГЛАВНЫЙ КОМПОНЕНТ ======
    const TimeTracker = () => {
      const [data, setData] = useState(initialData);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [lastSync, setLastSync] = useState(null);
      const [isOnline, setIsOnline] = useState(!!CONFIG.SCRIPT_URL);
      
      const { employees, projects, sections, tasks } = data;

      // Загрузка данных при старте
      useEffect(() => {
        const loadData = async () => {
          if (CONFIG.SCRIPT_URL) {
            const loaded = await api.load();
            if (loaded && loaded.employees) {
              setData(loaded);
              setLastSync(new Date());
              setIsOnline(true);
            } else {
              // Если не удалось загрузить — используем localStorage как fallback
              const local = localStorage.getItem('ligato_data');
              if (local) setData(JSON.parse(local));
              setIsOnline(false);
            }
          } else {
            // Нет настроенного API — работаем локально
            const local = localStorage.getItem('ligato_data');
            if (local) setData(JSON.parse(local));
            setIsOnline(false);
          }
          setLoading(false);
        };
        loadData();
      }, []);

      // Сохранение данных
      const saveData = useCallback(async (newData) => {
        setData(newData);
        localStorage.setItem('ligato_data', JSON.stringify(newData));
        
        if (CONFIG.SCRIPT_URL) {
          setSaving(true);
          const success = await api.save(newData);
          setSaving(false);
          if (success) {
            setLastSync(new Date());
            setIsOnline(true);
          } else {
            setIsOnline(false);
          }
        }
      }, []);

      // Обновление отдельных частей данных
      const updateData = (key, value) => {
        const newData = { ...data, [key]: typeof value === 'function' ? value(data[key]) : value };
        saveData(newData);
      };

      const setEmployees = (val) => updateData('employees', val);
      const setProjects = (val) => updateData('projects', val);
      const setSections = (val) => updateData('sections', val);
      const setTasks = (val) => updateData('tasks', val);

      // Периодическая синхронизация (каждые 30 сек)
      useEffect(() => {
        if (!CONFIG.SCRIPT_URL) return;
        const interval = setInterval(async () => {
          const loaded = await api.load();
          if (loaded && loaded.employees) {
            setData(loaded);
            setLastSync(new Date());
            setIsOnline(true);
          }
        }, 30000);
        return () => clearInterval(interval);
      }, []);

      const [currentUserId, setCurrentUserId] = useState(100);
      const [view, setView] = useState('gantt');
      const [selectedProject, setSelectedProject] = useState(null);
      const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
      const [expanded, setExpanded] = useState(new Set([1, 4, 6]));
      const [modal, setModal] = useState(null);
      const [form, setForm] = useState({});

      const today = new Date().toISOString().split('T')[0];
      const user = employees.find(e => e.id === currentUserId);
      const isMod = user?.isMod;

      const getSectionHours = (id) => tasks.filter(t => t.sectionId === id).reduce((s, t) => s + t.hours, 0);
      const getSectionProgress = (sec) => sec.plannedHours > 0 ? Math.min(Math.round((getSectionHours(sec.id) / sec.plannedHours) * 100), 100) : 0;

      const mySections = useMemo(() => sections.filter(s => s.employeeId === currentUserId), [sections, currentUserId]);
      const myTodayTasks = useMemo(() => {
        const ids = mySections.map(s => s.id);
        return tasks.filter(t => ids.includes(t.sectionId) && t.date === today);
      }, [tasks, mySections, today]);
      const myTodayHours = myTodayTasks.reduce((s, t) => s + t.hours, 0);

      const filteredSections = useMemo(() => {
        return selectedProject ? sections.filter(s => s.projectId === selectedProject) : sections;
      }, [sections, selectedProject]);

      const dateRange = useMemo(() => {
        const allDates = [
          ...filteredSections.map(s => new Date(s.deadline)),
          ...tasks.filter(t => filteredSections.some(s => s.id === t.sectionId)).map(t => new Date(t.date)),
          new Date(today)
        ];
        if (allDates.length === 0) {
          const days = [];
          for (let i = 0; i < 14; i++) days.push(new Date(Date.now() + i * 86400000));
          return days;
        }
        const min = new Date(Math.min(...allDates)); min.setDate(min.getDate() - 2);
        const max = new Date(Math.max(...allDates)); max.setDate(max.getDate() + 2);
        const days = [];
        for (let d = new Date(min); d <= max; d.setDate(d.getDate() + 1)) days.push(new Date(d));
        return days;
      }, [filteredSections, tasks, today]);

      const fmt = (d) => new Date(d).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
      const fmtFull = (d) => new Date(d).toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
      const fmtTime = (d) => d ? d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
      const isWknd = (d) => [0, 6].includes(new Date(d).getDay());
      const isToday = (d) => new Date(d).toISOString().split('T')[0] === today;

      const grouped = useMemo(() => {
        const projIds = [...new Set(filteredSections.map(s => s.projectId))];
        return projIds.map(pid => ({
          project: projects.find(p => p.id === pid),
          sections: filteredSections.filter(s => s.projectId === pid)
        }));
      }, [filteredSections, projects]);

      const stats = useMemo(() => ({
        sections: filteredSections.length,
        planned: filteredSections.reduce((s, sec) => s + sec.plannedHours, 0),
        actual: filteredSections.reduce((s, sec) => s + getSectionHours(sec.id), 0),
        progress: filteredSections.length ? Math.round(filteredSections.reduce((s, sec) => s + getSectionProgress(sec), 0) / filteredSections.length) : 0
      }), [filteredSections, tasks]);

      // CRUD операции
      const saveSection = () => {
        const { projectId, name, employeeId, deadline, plannedHours } = form;
        if (!projectId || !name || !employeeId || !deadline) return;
        if (modal === 'editSection') {
          setSections(sections.map(s => s.id === form.id ? { ...s, projectId: +projectId, name, employeeId: +employeeId, deadline, plannedHours: +plannedHours || 0 } : s));
        } else {
          setSections([...sections, { id: Date.now(), projectId: +projectId, name, employeeId: +employeeId, deadline, plannedHours: +plannedHours || 0 }]);
        }
        closeModal();
      };

      const deleteSection = (id) => {
        if (!confirm('Удалить раздел?')) return;
        setSections(sections.filter(s => s.id !== id));
        setTasks(tasks.filter(t => t.sectionId !== id));
      };

      const saveTask = () => {
        const { sectionId, date, hours, desc } = form;
        if (!hours || !desc) return;
        if (modal === 'editTask') {
          setTasks(tasks.map(t => t.id === form.id ? { ...t, date: date || today, hours: +hours, desc } : t));
        } else {
          setTasks([...tasks, { id: Date.now(), sectionId, date: date || today, hours: +hours, desc }]);
        }
        closeModal();
      };

      const deleteTask = (id) => {
        if (!confirm('Удалить?')) return;
        setTasks(tasks.filter(t => t.id !== id));
      };

      const saveProject = () => {
        if (!form.code || !form.name) return;
        setProjects([...projects, { id: Date.now(), code: form.code, name: form.name }]);
        closeModal();
      };

      const saveEmployee = () => {
        if (!form.name || !form.position) return;
        setEmployees([...employees, { id: Date.now(), name: form.name, position: form.position, isMod: form.isMod || false }]);
        closeModal();
      };

      const closeModal = () => { setModal(null); setForm({}); };

      const tasksByDate = useMemo(() => tasks.filter(t => t.date === selectedDate), [tasks, selectedDate]);

      const resetData = () => {
        if (confirm('Сбросить все данные к начальным значениям?')) {
          saveData(initialData);
        }
      };

      if (loading) {
        return (
          <div className="loading">
            <div className="spinner"></div>
            <div style={{ color: '#737373' }}>Загрузка данных...</div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-stone-50">
          {/* Header */}
          <header className="bg-white border-b border-stone-200 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              <div className="flex items-center gap-4">
                <div className="flex items-center gap-2.5">
                  <div className="w-9 h-9 rounded-lg bg-gradient-to-br from-blue-600 to-blue-700 flex items-center justify-center shadow-sm">
                    <span className="text-white font-semibold text-sm">Л</span>
                  </div>
                  <div className="hidden sm:block">
                    <div className="font-semibold text-stone-900 leading-tight">ЛИГАТО</div>
                    <div className="text-[11px] text-stone-500">Группа КЖ/КМ</div>
                  </div>
                </div>
                
                {/* Статус синхронизации */}
                <div className="hidden sm:flex items-center gap-2 text-xs">
                  {saving ? (
                    <span className="text-amber-600 flex items-center gap-1">
                      <span className="w-2 h-2 bg-amber-500 rounded-full animate-pulse"></span>
                      Сохранение...
                    </span>
                  ) : isOnline ? (
                    <span className="text-emerald-600 flex items-center gap-1">
                      <span className="w-2 h-2 bg-emerald-500 rounded-full"></span>
                      Онлайн {lastSync && `· ${fmtTime(lastSync)}`}
                    </span>
                  ) : (
                    <span className="text-stone-400 flex items-center gap-1">
                      <span className="w-2 h-2 bg-stone-400 rounded-full"></span>
                      Локально
                    </span>
                  )}
                </div>
              </div>
              
              <div className="flex items-center gap-2 sm:gap-3">
                <div className="flex items-center gap-2 px-2 sm:px-3 py-1.5 bg-stone-100 rounded-lg">
                  <div className={`w-2 h-2 rounded-full ${isMod ? 'bg-amber-500' : 'bg-blue-500'}`}></div>
                  <select
                    value={currentUserId}
                    onChange={(e) => setCurrentUserId(+e.target.value)}
                    className="bg-transparent text-sm font-medium text-stone-700 focus:outline-none cursor-pointer pr-1 max-w-[120px] sm:max-w-none"
                  >
                    {employees.map(e => <option key={e.id} value={e.id}>{e.name}</option>)}
                  </select>
                </div>
                
                {isMod && (
                  <button 
                    onClick={() => { setModal('addSection'); setForm({}); }}
                    className="h-9 px-3 sm:px-4 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition-colors"
                  >
                    <span className="hidden sm:inline">+ Назначить раздел</span>
                    <span className="sm:hidden">+ Раздел</span>
                  </button>
                )}
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 py-4 sm:py-6">
            {/* Предупреждение о настройке */}
            {!CONFIG.SCRIPT_URL && (
              <div className="mb-6 p-4 bg-amber-50 border border-amber-200 rounded-xl">
                <div className="flex items-start gap-3">
                  <span className="text-xl">⚠️</span>
                  <div>
                    <p className="font-medium text-amber-800">Работа в локальном режиме</p>
                    <p className="text-sm text-amber-700 mt-1">
                      Данные сохраняются только в этом браузере. Для общей работы команды настройте Google Sheets по инструкции в README.
                    </p>
                  </div>
                </div>
              </div>
            )}

            {/* Navigation */}
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
              <nav className="flex gap-1 p-1 bg-white rounded-xl border border-stone-200 shadow-sm overflow-x-auto">
                {[
                  ...(!isMod ? [{ id: 'my', label: 'Мои разделы' }] : []),
                  { id: 'gantt', label: 'График' },
                  { id: 'daily', label: 'По дням' },
                  { id: 'team', label: 'Команда' },
                ].map(t => (
                  <button
                    key={t.id}
                    onClick={() => setView(t.id)}
                    className={`px-3 sm:px-4 py-2 text-sm font-medium rounded-lg transition-all whitespace-nowrap ${
                      view === t.id 
                        ? 'bg-stone-900 text-white shadow-sm' 
                        : 'text-stone-600 hover:text-stone-900 hover:bg-stone-50'
                    }`}
                  >
                    {t.label}
                  </button>
                ))}
              </nav>
              
              <div className={`px-3 py-1.5 rounded-full text-xs font-medium self-start ${isMod ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'}`}>
                {isMod ? 'Руководитель' : 'Исполнитель'}
              </div>
            </div>

            {/* MY SECTIONS */}
            {view === 'my' && !isMod && (
              <div className="space-y-6">
                <div className="bg-white rounded-2xl border border-stone-200 shadow-sm overflow-hidden">
                  <div className="p-4 sm:p-6">
                    <div className="flex items-start justify-between">
                      <div>
                        <p className="text-sm text-stone-500 mb-1">Сегодня</p>
                        <p className="text-lg sm:text-xl font-semibold text-stone-900 capitalize">{fmtFull(today)}</p>
                      </div>
                      <div className="text-right">
                        <p className={`text-3xl sm:text-4xl font-bold ${myTodayHours >= 8 ? 'text-emerald-600' : 'text-amber-500'}`}>
                          {myTodayHours}
                        </p>
                        <p className="text-sm text-stone-500">часов</p>
                      </div>
                    </div>
                    
                    {myTodayHours < 8 && (
                      <div className="mt-4 flex items-center gap-2 text-sm text-amber-600">
                        <span>⚠️</span>
                        <span>Осталось записать {8 - myTodayHours} ч</span>
                      </div>
                    )}
                  </div>
                  
                  {myTodayTasks.length > 0 && (
                    <div className="border-t border-stone-100 bg-stone-50 p-4">
                      <p className="text-xs font-medium text-stone-500 uppercase tracking-wider mb-3">Записано сегодня</p>
                      <div className="space-y-2">
                        {myTodayTasks.map(t => {
                          const sec = sections.find(s => s.id === t.sectionId);
                          return (
                            <div key={t.id} className="flex items-center gap-3 bg-white rounded-lg p-3 shadow-sm">
                              <div className="w-10 h-10 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center font-semibold text-sm shrink-0">
                                {t.hours}ч
                              </div>
                              <div className="flex-1 min-w-0">
                                <p className="text-sm font-medium text-stone-900 truncate">{t.desc}</p>
                                <p className="text-xs text-stone-500">{sec?.name}</p>
                              </div>
                              <button onClick={() => { setModal('editTask'); setForm(t); }} className="p-1.5 text-stone-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors shrink-0">
                                ✎
                              </button>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>

                <div>
                  <h2 className="text-lg font-semibold text-stone-900 mb-4">Мои разделы</h2>
                  <div className="space-y-3">
                    {mySections.map(section => {
                      const proj = projects.find(p => p.id === section.projectId);
                      const actual = getSectionHours(section.id);
                      const progress = getSectionProgress(section);
                      const sectionTasks = tasks.filter(t => t.sectionId === section.id);
                      const isOverdue = section.deadline < today && progress < 100;
                      const isDone = progress >= 100;

                      return (
                        <div 
                          key={section.id} 
                          className={`bg-white rounded-2xl border shadow-sm overflow-hidden transition-all hover:shadow-md cursor-pointer ${
                            isOverdue ? 'border-red-200' : isDone ? 'border-emerald-200' : 'border-stone-200'
                          }`}
                          onClick={() => { setModal('addTask'); setForm({ sectionId: section.id, hours: '8', date: today }); }}
                        >
                          <div className="p-4 sm:p-5">
                            <div className="flex items-start justify-between mb-3">
                              <div className="flex-1 min-w-0 pr-4">
                                <div className="flex items-center gap-2 mb-1 flex-wrap">
                                  <h3 className="font-semibold text-stone-900">{section.name}</h3>
                                  {isOverdue && <span className="px-2 py-0.5 bg-red-100 text-red-600 text-[10px] font-medium rounded-full">просрочен</span>}
                                  {isDone && <span className="px-2 py-0.5 bg-emerald-100 text-emerald-600 text-[10px] font-medium rounded-full">готово</span>}
                                </div>
                                <p className="text-sm text-stone-500">{proj?.code} · {proj?.name}</p>
                              </div>
                              <div className="text-right shrink-0">
                                <p className={`text-2xl font-bold ${isDone ? 'text-emerald-600' : 'text-stone-900'}`}>{progress}%</p>
                                <p className="text-xs text-stone-500">{actual} / {section.plannedHours} ч</p>
                              </div>
                            </div>
                            
                            <div className="flex items-center gap-3">
                              <div className="flex-1 h-2 bg-stone-100 rounded-full overflow-hidden">
                                <div

                      </div>
                      <div>
                        <label className="block text-sm font-medium text-stone-700 mb-1.5">Часы</label>
                        <div className="flex gap-2 mb-2">
                          {[1, 2, 4, 6, 8].map(h => (
                            <button key={h} onClick={() => setForm({ ...form, hours: h.toString() })} className={`flex-1 h-10 rounded-lg text-sm font-medium transition-colors ${form.hours === h.toString() ? 'bg-blue-600 text-white' : 'bg-stone-100 text-stone-700 hover:bg-stone-200'}`}>{h}</button>
                          ))}
                        </div>
                        <input type="number" step="0.5" value={form.hours || ''} onChange={e => setForm({ ...form, hours: e.target.value })} placeholder="Или введите вручную" className="w-full h-10 px-3 border border-stone-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-stone-700 mb-1.5">Что сделано</label>
                        <textarea value={form.desc || ''} onChange={e => setForm({ ...form, desc: e.target.value })} placeholder="Опишите выполненную работу..." rows={3} className="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none" />
                      </div>
                    </div>
                    <div className="px-5 sm:px-6 py-4 border-t border-stone-200 flex justify-end gap-3">
                      <button onClick={closeModal} className="h-10 px-4 text-sm font-medium text-stone-600 hover:bg-stone-100 rounded-lg">Отмена</button>
                      <button onClick={saveTask} disabled={!form.desc} className="h-10 px-5 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 disabled:bg-stone-300 rounded-lg">Записать</button>
                    </div>
                  </>
                )}

                {modal === 'addProject' && (
                  <>
                    <div className="px-5 sm:px-6 py-5 border-b border-stone-200">
                      <h2 className="text-lg font-semibold text-stone-900">Добавить проект</h2>
                    </div>
                    <div className="px-5 sm:px-6 py-5 space-y-4">
                      <div>
                        <label className="block text-sm font-medium text-stone-700 mb-1.5">Шифр</label>
                        <input type="text" value={form.code || ''} onChange={e => setForm({ ...form, code: e.target.value })} placeholder="2025-01" className="w-full h-10 px-3 border border-stone-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-stone-700 mb-1.5">Название</label>
                        <input type="text" value={form.name || ''} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="ЖК Название" className="w-full h-10 px-3 border border-stone-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                      </div>
                    </div>
                    <div className="px-5 sm:px-6 py-4 border-t border-stone-200 flex justify-end gap-3">
                      <button onClick={closeModal} className="h-10 px-4 text-sm font-medium text-stone-600 hover:bg-stone-100 rounded-lg">Отмена</button>
                      <button onClick={saveProject} className="h-10 px-5 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg">Добавить</button>
                    </div>
                  </>
                )}

                {modal === 'addEmployee' && (
                  <>
                    <div className="px-5 sm:px-6 py-5 border-b border-stone-200">
                      <h2 className="text-lg font-semibold text-stone-900">Добавить сотрудника</h2>
                    </div>
                    <div className="px-5 sm:px-6 py-5 space-y-4">
                      <div>
                        <label className="block text-sm font-medium text-stone-700 mb-1.5">ФИО</label>
                        <input type="text" value={form.name || ''} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="Иванов И.И." className="w-full h-10 px-3 border border-stone-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-stone-700 mb-1.5">Должность</label>
                        <input type="text" value={form.position || ''} onChange={e => setForm({ ...form, position: e.target.value })} placeholder="Инженер" className="w-full h-10 px-3 border border-stone-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                      </div>
                      <label className="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" checked={form.isMod || false} onChange={e => setForm({ ...form, isMod: e.target.checked })} className="w-4 h-4 rounded border-stone-300" />
                        <span className="text-sm text-stone-700">Руководитель</span>
                      </label>
                    </div>
                    <div className="px-5 sm:px-6 py-4 border-t border-stone-200 flex justify-end gap-3">
                      <button onClick={closeModal} className="h-10 px-4 text-sm font-medium text-stone-600 hover:bg-stone-100 rounded-lg">Отмена</button>
                      <button onClick={saveEmployee} className="h-10 px-5 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg">Добавить</button>
                    </div>
                  </>
                )}
              </div>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<TimeTracker />);
  </script>
</body>
</html>
